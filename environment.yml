name: geo-insight
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # Data
  - pandas=3.0.2
  - numpy=2.4.3
  - openpyxl=3.1.5
  - pyarrow=23.0.1
  - requests=2.33.1
  - httpx=0.28.1
  - tqdm=4.67.3
  # Geospatial (conda-forge handles binary deps)
  - geopandas=1.1.3
  - fiona=1.10.1
  - shapely=2.1.2
  # Notebook
  - jupyter=1.1.1
  - ipykernel=7.2.0
  - pip:
      - pytest==9.0.3
      - anthropic==0.96.0
      - fastapi==0.136.0
      - uvicorn[standard]==0.44.0
      - pydantic==2.13.2
      - streamlit==1.56.0
      - plotly==6.7.0
      - folium==0.20.0
      - streamlit-folium==0.27.1
      - python-dotenv==1.2.2
      - kaleido==0.2.1
      - openai==1.86.0
      - databricks-sdk==0.102.0
      - databricks-sql-connector==3.7.0
