name: geo-insight
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  # Data (conda-forge builds are faster/more stable for these)
  - pandas=2.0.0
  - numpy=1.23.5
  - pyarrow=21.0.0
  - openpyxl=3.1.5
  - scikit-learn=1.2.1
  - requests=2.32.3
  - httpx=0.27.0
  - tqdm=4.65.0
  - pip:
      - fastapi==0.98.0
      - uvicorn[standard]==0.22.0
      - pydantic==1.10.8        # v1 API — do NOT upgrade to v2 without code changes
      - databricks-sql-connector==4.2.5
      - openai==2.32.0          # OpenAI-compatible client for Databricks LLM endpoints
      - python-dotenv==1.0.0
